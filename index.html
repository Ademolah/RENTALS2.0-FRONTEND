<!doctype html>

    <meta name="theme-color" content="#F25F5C" />

    <!-- ========================================== -->
    <!-- PRIMARY META TAGS (The Google Foundation)  -->

    <title>Rentals Africa | Premium Hospitality, Hotels & VIP Venues</title>
    <meta name="title" content="Rentals Africa | Premium Hospitality, Hotels & VIP Venues" />

    <link rel="canonical" href="https://rentalsafrica.com/" />

    <!-- ========================================== -->
    <!-- OPEN GRAPH (For WhatsApp, LinkedIn, Facebook)-->

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Rentals Africa | Premium Hospitality & Stays" />

    <meta property="og:site_name" content="Rentals Africa" />

    <!-- ========================================== -->
    <!-- TWITTER CARDS (For X / Twitter Previews)   -->
